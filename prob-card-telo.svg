<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">

  <!-- Lavender circle — small, peeking behind top-left of browser -->
  <circle cx="110" cy="118" r="38" fill="#C5C0D4" opacity="0.5"/>

  <!-- Sand circle — behind question mark, bottom-right -->
  <circle cx="308" cy="302" r="40" fill="#D4C5B0" opacity="0.55"/>

  <!-- Browser window body -->
  <rect x="100" y="94" width="210" height="188" rx="12" fill="white" stroke="#5A5A58" stroke-width="2"/>

  <!-- Title bar separator -->
  <line x1="100" y1="126" x2="310" y2="126" stroke="#EDEAE3" stroke-width="1.5"/>

  <!-- Traffic light dots -->
  <circle cx="122" cy="110" r="5" fill="#E8644A"/>
  <circle cx="138" cy="110" r="5" fill="#BDBDBD"/>
  <circle cx="154" cy="110" r="5" fill="#BDBDBD"/>

  <!-- BAR CHART — left side, all bars bottom at y=228 -->
  <rect x="114" y="200" width="18" height="28" rx="3" fill="#D4C5B0"/>
  <rect x="138" y="186" width="18" height="42" rx="3" fill="#B5C4B1"/>
  <rect x="162" y="172" width="18" height="56" rx="3" fill="#C5C0D4"/>
  <rect x="186" y="158" width="18" height="70" rx="3" fill="#E8644A" opacity="0.85"/>

  <!-- PIE CHART — right side, center (264,190) r=34 -->
  <!-- Slice 1 sand: 0°→130° clockwise from top -->
  <path d="M264,190 L264,156 A34,34,0,0,1,290,214 Z" fill="#D4C5B0"/>
  <!-- Slice 2 lavender: 130°→250° -->
  <path d="M264,190 L290,214 A34,34,0,0,1,232,202 Z" fill="#C5C0D4"/>
  <!-- Slice 3 sage: 250°→360° -->
  <path d="M264,190 L232,202 A34,34,0,0,1,264,156 Z" fill="#B5C4B1"/>
  <!-- White slice dividers -->
  <line x1="264" y1="190" x2="264" y2="156" stroke="white" stroke-width="2"/>
  <line x1="264" y1="190" x2="290" y2="214" stroke="white" stroke-width="2"/>
  <line x1="264" y1="190" x2="232" y2="202" stroke="white" stroke-width="2"/>
  <!-- Pie outline -->
  <circle cx="264" cy="190" r="34" fill="none" stroke="#5A5A58" stroke-width="1.5"/>

  <!-- Divider -->
  <line x1="114" y1="240" x2="296" y2="240" stroke="#EDEAE3" stroke-width="1.5"/>

  <!-- Legend rows -->
  <circle cx="122" cy="254" r="3" fill="#BDBDBD"/>
  <rect x="132" y="250" width="58" height="7" rx="3.5" fill="#EDEAE3"/>
  <rect x="204" y="250" width="44" height="7" rx="3.5" fill="#EDEAE3"/>

  <circle cx="122" cy="268" r="3" fill="#BDBDBD"/>
  <rect x="132" y="264" width="44" height="7" rx="3.5" fill="#EDEAE3"/>
  <rect x="204" y="264" width="58" height="7" rx="3.5" fill="#EDEAE3"/>

  <!-- Question mark circle — outside browser, bottom-right -->
  <circle cx="306" cy="298" r="30" fill="white" stroke="#5A5A58" stroke-width="2"/>
  <text x="306" y="310" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="400" fill="#3A3A38">?</text>

</svg>
