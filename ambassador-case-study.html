                --color-coral-dark: #c44a32;
                --color-ink: #1a1a18;
                --color-stone: #888780;
                --color-linen: #edeae3;
                --color-cream: #faf7f2;
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            .staticrypt-html {
                height: 100%;
            }

            .staticrypt-body {
                height: 100%;
                margin: 0;
                background: var(--color-cream);
                font-family: "Figtree", sans-serif;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
                color: var(--color-ink);
            }

            .staticrypt-content {
                min-height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
            }

            .staticrypt-page {
                width: 100%;
                max-width: 420px;
            }

            .staticrypt-form {
                background: #ffffff;
                border: 1px solid var(--color-linen);
                border-radius: 16px;
                padding: 44px 40px 40px;
                text-align: center;
                box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            }

            .staticrypt-logo {
                width: 48px;
                height: 48px;
                border-radius: 10px;
                display: block;
                margin: 0 auto 18px;
            }

            .staticrypt-lock-row {
                font-size: 0.75rem;
                letter-spacing: 0.12em;
                text-transform: uppercase;
                color: var(--color-stone);
                font-weight: 600;
                margin-bottom: 14px;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 7px;
            }

            .staticrypt-title {
                font-size: 1.5rem;
                font-weight: 700;
                letter-spacing: -0.02em;
                line-height: 1.2;
                color: var(--color-ink);
                margin-bottom: 10px;
            }

            .staticrypt-instructions p:last-child {
                font-size: 0.9375rem;
                color: #71717c;
                line-height: 1.65;
                margin: 0 auto 26px;
                max-width: 320px;
            }

            .staticrypt-password-container {
                position: relative;
                width: 100%;
                margin: 0 0 12px;
            }

            .staticrypt-form input[type="password"],
            .staticrypt-form input[type="text"] {
                background: #ffffff;
                border: 1px solid var(--color-linen);
                border-radius: 8px;
                font-family: "Figtree", sans-serif;
                font-size: 16px;
                color: var(--color-ink);
                outline: 0;
                padding: 13px 44px 13px 15px;
                width: 100%;
                transition: border-color 0.15s, box-shadow 0.15s;
            }

            .staticrypt-form input[type="password"]:focus,
            .staticrypt-form input[type="text"]:focus {
                border-color: var(--color-coral);
                box-shadow: 0 0 0 3px rgba(232, 100, 74, 0.18);
            }

            .staticrypt-form input::placeholder {
                color: var(--color-stone);
            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 18px;
                width: 18px;
                opacity: 45%;
                padding: 13px;
                position: absolute;
                right: 2px;
                top: 50%;
                transform: translateY(-50%);
                box-sizing: content-box;
            }

            .staticrypt-toggle-password-visibility:hover {
                opacity: 75%;
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                gap: 9px;
                margin: 2px 2px 18px;
                font-size: 0.875rem;
                color: #71717c;
                cursor: pointer;
                user-select: none;
            }

            .staticrypt-remember input[type="checkbox"] {
                width: 16px;
                height: 16px;
                accent-color: var(--color-coral);
                cursor: pointer;
            }

            .staticrypt-form .staticrypt-decrypt-button {
                font-family: "Figtree", sans-serif;
                outline: 0;
                background: var(--color-coral);
                width: 100%;
                border: 0;
                border-radius: 8px;
                padding: 13px;
                color: #ffffff;
                font-size: 0.9375rem;
                font-weight: 600;
                letter-spacing: 0.01em;
                cursor: pointer;
                transition: background 0.15s;
            }

            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:active,
            .staticrypt-form .staticrypt-decrypt-button:focus {
                background: var(--color-coral-dark);
            }

            .staticrypt-error {
                display: none;
                font-size: 0.875rem;
                color: var(--color-coral-dark);
                background: #fadbd4;
                border-radius: 8px;
                padding: 10px 14px;
                margin: 0 0 12px;
                line-height: 1.5;
            }

            .staticrypt-error.show {
                display: block;
            }

            .staticrypt-foot {
                margin-top: 24px;
                font-size: 0.875rem;
                color: var(--color-stone);
                text-align: center;
            }

            .staticrypt-foot a {
                color: var(--color-ink);
                text-decoration: none;
                border-bottom: 1px solid var(--color-linen);
                padding-bottom: 1px;
                transition: border-color 0.15s;
            }

            .staticrypt-foot a:hover {
                border-color: var(--color-coral);
            }

            .hidden {
                display: none !important;
            }

            .staticrypt-spinner-container {
                height: 100%;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .staticrypt-spinner {
                display: inline-block;
                width: 2rem;
                height: 2rem;
                vertical-align: text-bottom;
                border: 0.25em solid var(--color-linen);
                border-right-color: var(--color-coral);
                border-radius: 50%;
                animation: spinner-border 0.75s linear infinite;
            }

            @keyframes spinner-border {
                100% {
                    transform: rotate(360deg);
                }
            }

            @media (max-width: 480px) {
                .staticrypt-form {
                    padding: 36px 24px 32px;
                }
            }
        </style>
